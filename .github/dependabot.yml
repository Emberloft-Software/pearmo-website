# Dependabot opens pull requests when dependencies have security fixes or
# new versions. Minor and patch updates are grouped into one weekly PR so it
# stays quiet; major versions come one at a time so they get a proper look.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
